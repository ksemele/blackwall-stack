---
# Shared credentials for the all-in-one master.
# Indexer / dashboard / filebeat (one OpenSearch admin account):
wazuh_indexer_admin_user: "admin"
wazuh_indexer_admin_password: "Blackwall1!"

# Manager REST API (separate user system, on the manager process):
wazuh_manager_api_user: "wazuh"
wazuh_manager_api_password: "wazuh"

# Lab: the stopped black-dead-98 fixture should read as disconnected right
# after `bw-lab up`, not ten minutes later.
wazuh_agents_disconnection_time: 1m

# nftables (role blackwall-eye/nftables).
# WARNING: closing 9200/9300 silently breaks alert delivery into the indexer —
# filebeat and the dashboard reach it over the interface address (172.28.0.10),
# not over loopback, so those packets traverse the input chain.
#   22    ssh for ansible
#   443   wazuh-dashboard (published as localhost:5601)
#   1514  agent event intake
#   1515  authd enrollment
#   9100  node_exporter, scraped by black-metrics-00
#   9200  indexer REST
#   9300  indexer transport
#   55000 wazuh-manager REST API
nft_public_tcp: [22, 443, 1514, 1515, 9100, 9200, 9300, 55000]

# Brain v2 (role blackwall-brain/brain-analyst): reads alerts from the indexer
# with a read-only user the role creates through the admin account. The
# indexer listens on the interface address (see above), not on loopback.
brain_indexer_url: "https://172.28.0.10:9200"
brain_indexer_password: "BrainRead1!"
brain_indexer_verify_tls: false
brain_indexer_admin_user: "{{ wazuh_indexer_admin_user }}"
brain_indexer_admin_password: "{{ wazuh_indexer_admin_password }}"
brain_dashboard_url: "https://localhost:5601"
