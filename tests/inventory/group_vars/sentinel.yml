---
# Rocky 9 server node (Wazuh server stack, podman nginx fixture).
nft_public_tcp: [22]

# Wazuh server stack bound to loopback (certs generated per host).
wazuh_cert_ip: "127.0.0.1"
wazuh_certs_local_dir: "{{ playbook_dir }}/../../../tests/.wazuh-certs/{{ inventory_hostname }}"
wazuh_indexer_network_host: "127.0.0.1"
wazuh_indexer_heap: "1g"
wazuh_api_host: "127.0.0.1"
