---
# Marks the lab: enables the destructive parts of verify-nftables.yml.
bw_lab: true

# Lab-only: fetch Wazuh packages through the apt cache (black-aptcache-00).
# packages.wazuh.com is HTTPS-only, and apt-cacher-ng cannot cache through a
# CONNECT tunnel; the cache remaps this http:// URL to the https:// upstream
# (tests/docker/images/aptcache/blackwall.conf). Package integrity still comes
# from the Wazuh GPG signature on the repo metadata, not from TLS. The role
# defaults keep https://, so nothing changes outside the lab.
wazuh_apt_repo_url: "http://packages.wazuh.com/4.x/apt/"

# Agents that are broken on purpose (bw-lab provision fixtures); agent checks
# skip them.
wazuh_fixture_agents: [black-dead-98]

# Firewall drop events: poll fast so lab tests do not wait a minute.
wazuh_fw_events_interval: 10

# Report every growth: the fw-events check sends traffic from the same source twice.
nft_track_report_cooldown: 0
