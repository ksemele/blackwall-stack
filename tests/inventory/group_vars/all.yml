---
# Marks the lab: enables the destructive parts of verify-nftables.yml.
bw_lab: true

# Lab-only: fetch Wazuh packages through the apt cache (black-aptcache-00).
# packages.wazuh.com is HTTPS-only, and apt-cacher-ng cannot cache through a
# CONNECT tunnel; the cache remaps this http:// URL to the https:// upstream
# (tests/docker/images/aptcache/blackwall.conf). Package integrity still comes
# from the Wazuh GPG signature on the repo metadata, not from TLS. The role
# defaults keep https://, so nothing changes outside the lab.
wazuh_apt_repo_url: "http://packages.wazuh.com/4.x/apt/"

# Agents that are broken on purpose (bw-lab provision fixtures); agent checks
# skip them.
wazuh_fixture_agents: [black-dead-98]

# Firewall drop events: poll fast so lab tests do not wait a minute.
wazuh_fw_events_interval: 10

# Report every growth: the fw-events check sends traffic from the same source twice.
nft_track_report_cooldown: 0

# Real-time FIM off in the lab: wazuh-syscheckd needs an inotify instance, and a
# rootless-podman host charges that instance to the host user's single budget
# (fs.inotify.max_user_instances, 128 on Ubuntu) together with conmon, pasta and
# the systemd inside every lab container. The budget runs out, syscheckd logs
# "Unable to initialize inotify", its scan blocks, and wazuh-agent.service dies
# at its 45 s start timeout. Containers cannot raise the sysctl themselves
# (podman: "sysctl 'fs.inotify.max_user_instances' is not allowed"), so the lab
# monitors by scheduled scan instead. Role defaults keep real-time FIM on real
# hosts; set this back to true on a host with room for the instances (Docker's
# Linux VM has its own budget; on a rootless-podman host it needs
# `sudo sysctl fs.inotify.max_user_instances=524288`).
wazuh_fim_realtime: false

# FIM then has to catch a change on a scan, so scan often: bw-trigger passwd and
# the other file triggers should show up in minutes, not in 12 hours.
wazuh_syscheck_frequency: 600
