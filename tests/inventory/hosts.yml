all:
  vars:
    ansible_user: root
    ansible_password: blackwall
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
    ansible_python_interpreter: /usr/bin/python3
    # Secrets come from the environment (.envrc via direnv, see .envrc.example).
    telegram_bot_token: "{{ lookup('env', 'BW_TELEGRAM_BOT_TOKEN') }}"
    telegram_chat_id: "{{ lookup('env', 'BW_TELEGRAM_CHAT_ID') }}"
    claude_api_key: "{{ lookup('env', 'BW_CLAUDE_API_KEY') }}"
    claude_workspace_id: "{{ lookup('env', 'BW_CLAUDE_WORKSPACE_ID') }}"
    # Lab provisioning floods level-7 alerts (~280/day); only level 10+ reach
    # Telegram (voice) and Claude (brain) here. Role defaults stay for real hosts.
    severity_threshold: 10
    analysis_threshold: 10
    # One message per alert: with Brain on, voice stops at analysis_threshold - 1
    # and Brain covers the rest. Brain off (brain_enabled=false) -> no upper
    # bound. The roles do not import each other; this is the only link, and the
    # voice role additionally ignores the bound if brain-analyst is not running.
    voice_max_level: "{{ (analysis_threshold | int - 1) if (brain_enabled | default(true) | bool) else '' }}"

  children:
    ubuntu2204:
      hosts:
        black-master-00: {ansible_host: localhost, ansible_port: 2200}
        black-host-01:   {ansible_host: localhost, ansible_port: 2201}
        black-dead-98:   {ansible_host: localhost, ansible_port: 2202}
    rhel9:
      hosts:
        black-rocky-02:  {ansible_host: localhost, ansible_port: 2203}
        black-sentinel-03: {ansible_host: localhost, ansible_port: 2204}
    sentinel:
      hosts:
        black-sentinel-03:
    wazuh_managers:
      hosts:
        black-master-00:
    wazuh_agents:
      hosts:
        black-host-01:
        black-dead-98:
        black-rocky-02:

    # Cloudflare origin filter (cf-wall role). The lab serves nothing on
    # 80/443, so the filter is inert here; it proves deploy and refresh.
    cf_wall:
      hosts:
        black-host-01:
        black-rocky-02:

    # Future distro groups — match port ranges in docker-compose.yml comments.
    # debian12: ...
    # centos9: ...
