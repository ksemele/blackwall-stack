all:
  vars:
    ansible_user: root
    ansible_password: blackwall
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
    ansible_python_interpreter: /usr/bin/python3
    # Secrets come from the environment (.envrc via direnv, see .envrc.example).
    telegram_bot_token: "{{ lookup('env', 'BW_TELEGRAM_BOT_TOKEN') }}"
    telegram_chat_id: "{{ lookup('env', 'BW_TELEGRAM_CHAT_ID') }}"
    claude_api_key: "{{ lookup('env', 'BW_CLAUDE_API_KEY') }}"
    claude_workspace_id: "{{ lookup('env', 'BW_CLAUDE_WORKSPACE_ID') }}"
    # Lab provisioning floods level-7 alerts (~280/day); only level 10+ reach
    # Telegram (voice) and Claude (brain) here. Role defaults stay for real hosts.
    severity_threshold: 10
    analysis_threshold: 10

  children:
    ubuntu2204:
      children:
        wazuh_managers:
          hosts:
            black-master-00:
              ansible_host: localhost
              ansible_port: 2200
        wazuh_agents:
          hosts:
            black-host-01:
              ansible_host: localhost
              ansible_port: 2201
            black-dead-98:
              ansible_host: localhost
              ansible_port: 2202

    # Future distro groups — match port ranges in docker-compose.yml comments.
    # debian12: ...
    # centos9: ...
