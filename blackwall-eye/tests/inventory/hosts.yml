all:
  vars:
    ansible_user: root
    ansible_password: blackwall
    ansible_ssh_common_args: >-
      -o StrictHostKeyChecking=no
      -o UserKnownHostsFile=/dev/null
    ansible_python_interpreter: /usr/bin/python3

  children:
    # Ubuntu 22.04 test hosts (docker compose --profile ubuntu2204)
    ubuntu2204:
      children:
        wazuh_managers:
          hosts:
            black-00:
              ansible_host: localhost
              ansible_port: 2200
        wazuh_agents:
          vars:
            wazuh_manager_host: "172.28.0.10"
          hosts:
            black-01:
              ansible_host: localhost
              ansible_port: 2201
            black-02:
              ansible_host: localhost
              ansible_port: 2202

