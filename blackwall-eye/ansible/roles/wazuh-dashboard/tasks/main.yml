---
- name: Debian — install dashboard
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: Install wazuh-dashboard package
      apt:
        name: "wazuh-dashboard{{ wazuh_pkg_suffix }}"
        allow_change_held_packages: true
        state: present
        update_cache: true

    - name: Hold wazuh-dashboard
      ansible.builtin.dpkg_selections:
        name: wazuh-dashboard
        selection: hold

- name: RedHat — install dashboard
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.dnf:
    name: "wazuh-dashboard{{ wazuh_pkg_suffix }}"
    disable_excludes: wazuh
    state: present

- name: Ensure /etc/wazuh-dashboard/certs dir exists
  file:
    path: /etc/wazuh-dashboard/certs
    state: directory
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0500"

- name: Copy dashboard TLS certs from bundle
  copy:
    src: "/tmp/wazuh-certificates/{{ item.src }}"
    dest: "/etc/wazuh-dashboard/certs/{{ item.dest }}"
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0400"
    remote_src: true
  loop:
    - { src: "root-ca.pem",                              dest: "root-ca.pem" }
    - { src: "{{ wazuh_dashboard_node_name }}.pem",      dest: "{{ wazuh_dashboard_node_name }}.pem" }
    - { src: "{{ wazuh_dashboard_node_name }}-key.pem",  dest: "{{ wazuh_dashboard_node_name }}-key.pem" }
  notify: Restart wazuh-dashboard

- name: Deploy opensearch_dashboards.yml
  template:
    src: opensearch_dashboards.yml.j2
    dest: /etc/wazuh-dashboard/opensearch_dashboards.yml
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0640"
  notify: Restart wazuh-dashboard

- name: Compute desired keystore creds hash
  set_fact:
    _keystore_desired_hash: "{{ (wazuh_indexer_admin_user + ':' + wazuh_indexer_admin_password) | hash('sha256') }}"
  no_log: true

- name: Check keystore creds marker
  stat:
    path: /usr/share/wazuh-dashboard/data/.blackwall-keystore-hash
  register: _keystore_marker

- name: Read marker content
  slurp:
    src: /usr/share/wazuh-dashboard/data/.blackwall-keystore-hash
  register: _keystore_marker_content
  when: _keystore_marker.stat.exists

- name: Set keystore creds when marker missing or stale
  when:
    - not _keystore_marker.stat.exists
      or (_keystore_marker_content.content | b64decode | trim) != _keystore_desired_hash
  notify: Restart wazuh-dashboard
  block:
    - name: Update keystore opensearch.username
      shell: |
        echo -n "{{ wazuh_indexer_admin_user }}" | \
          su -s /bin/bash wazuh-dashboard -c \
          "/usr/share/wazuh-dashboard/bin/opensearch-dashboards-keystore add -fx opensearch.username"

    - name: Update keystore opensearch.password
      shell: |
        echo -n "{{ wazuh_indexer_admin_password }}" | \
          su -s /bin/bash wazuh-dashboard -c \
          "/usr/share/wazuh-dashboard/bin/opensearch-dashboards-keystore add -fx opensearch.password"
      no_log: true

    - name: Write keystore creds marker
      copy:
        content: "{{ _keystore_desired_hash }}"
        dest: /usr/share/wazuh-dashboard/data/.blackwall-keystore-hash
        owner: wazuh-dashboard
        group: wazuh-dashboard
        mode: "0600"

- name: Ensure embedded Wazuh app config dir exists
  file:
    path: /usr/share/wazuh-dashboard/data/wazuh/config
    state: directory
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0750"

- name: Deploy embedded Wazuh app config (wazuh.yml)
  template:
    src: wazuh.yml.j2
    dest: /usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml
    owner: wazuh-dashboard
    group: wazuh-dashboard
    mode: "0640"
  notify: Restart wazuh-dashboard

# Flush any pending Restart handlers BEFORE we (re)start the service.
# This avoids a race where:
#   1. dashboard service starts, begins .kibana_1 migration
#   2. handlers fire later in the play, restart dashboard mid-migration
#   3. fresh dashboard instance finds .kibana_1 in-flight, gets stuck on
#      "Another OpenSearch Dashboards instance appears to be migrating".
# By flushing first, all config-induced restarts happen before initial start.
- name: Flush handlers before dashboard start
  meta: flush_handlers

- name: Enable and start wazuh-dashboard service
  systemd:
    name: wazuh-dashboard
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for dashboard HTTPS to return 302 (full init)
  uri:
    url: "https://127.0.0.1:{{ wazuh_dashboard_listen_port }}/"
    method: GET
    status_code: 302
    validate_certs: false
    follow_redirects: none
  register: _dash_check
  until: _dash_check.status == 302
  retries: 60
  delay: 5
