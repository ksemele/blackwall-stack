---
- name: Skip role when disabled
  ansible.builtin.meta: end_host
  when: not nft_enabled

- name: Refresh apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == 'Debian'

- name: Install nftables
  ansible.builtin.package:
    name: nftables
    state: present

- name: Create rules directory
  ansible.builtin.file:
    path: /etc/nftables.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render ruleset to a staging path
  ansible.builtin.include_tasks: render.yml
  vars:
    nft_render_dest: /etc/nftables.d/.blackwall-base.nft.new

- name: Syntax-check the rendered ruleset
  ansible.builtin.command: nft -c -f /etc/nftables.d/.blackwall-base.nft.new
  changed_when: false

- name: Install checked ruleset
  ansible.builtin.copy:
    src: /etc/nftables.d/.blackwall-base.nft.new
    dest: /etc/nftables.d/blackwall-base.nft
    remote_src: true
    owner: root
    group: root
    mode: "0600"
  notify: Reload nftables

- name: Remove staging file
  ansible.builtin.file:
    path: /etc/nftables.d/.blackwall-base.nft.new
    state: absent
  changed_when: false

- name: Install nftables.conf
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ nft_conf_path }}"
    owner: root
    group: root
    mode: "0644"
  notify: Reload nftables

- name: Create nftables.service drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/system/nftables.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Install nftables.service drop-in (no global flush)
  ansible.builtin.template:
    src: nftables-dropin.conf.j2
    dest: /etc/systemd/system/nftables.service.d/blackwall.conf
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Reload nftables

- name: Apply the drop-in before the service is touched
  ansible.builtin.meta: flush_handlers

- name: Enable and start nftables
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
