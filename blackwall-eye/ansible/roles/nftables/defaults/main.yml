---
# Disable the role entirely on a host
nft_enabled: true

# External interface. Check with: ip -o -4 route show to default | awk '{print $5}'
nft_wan_if: eth0

# TCP ports open to everyone
nft_public_tcp: [22]

# Ports reachable only from the listed sources:
#   nft_restricted:
#     - port: 9100
#       name: monitor_v4   # optional, default src_<port>
#       sources: [172.28.0.12]
nft_restricted: []

# podman host: container subnet and bridge. When set, the base table adds
# anti-spoofing, container DNS to the host and forwarding for published ports.
#   nft_podman:
#     net: 10.88.0.0/16
#     if: podman0
nft_podman: {}

nft_forward_policy: accept
nft_log_drops: true

# Per-source accounting of dropped packets (IPv4): dynamic sets dropped_input
# (and dropped_forward when nft_forward_policy is drop) with per-element
# counters, updated right before the final counter, so only dropped packets
# are counted. Inspect: nft list set inet blackwall_base dropped_input
nft_track_drops: true
nft_track_timeout: 1h
nft_track_size: 65536
# Packets from one source between two exporter runs that make it a "burst"
# (scan); rendered into /etc/blackwall/fw-export.conf for blackwall-fw-export.
nft_track_scan_threshold: 20
# Cap on lines printed by one exporter run (highest growth first, rest summarised).
nft_track_max_lines: 200

# Main nftables config loaded by nftables.service (differs per OS family)
nft_conf_path: "{{ '/etc/sysconfig/nftables.conf' if ansible_facts['os_family'] == 'RedHat' else '/etc/nftables.conf' }}"
