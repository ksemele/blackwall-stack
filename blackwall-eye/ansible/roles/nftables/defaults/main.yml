---
# Disable the role entirely on a host
nft_enabled: true

# External interface. Check with: ip -o -4 route show to default | awk '{print $5}'
nft_wan_if: eth0

# TCP ports open to everyone
nft_public_tcp: [22]

# Ports reachable only from the listed sources:
#   nft_restricted:
#     - port: 9100
#       name: monitor_v4   # optional, default src_<port>
#       sources: [172.28.0.12]
nft_restricted: []

# podman host: container subnet and bridge. When set, the base table adds
# anti-spoofing, container DNS to the host and forwarding for published ports.
#   nft_podman:
#     net: 10.88.0.0/16
#     if: podman0
nft_podman: {}

nft_forward_policy: accept
nft_log_drops: true

# Main nftables config loaded by nftables.service (differs per OS family)
nft_conf_path: "{{ '/etc/sysconfig/nftables.conf' if ansible_os_family == 'RedHat' else '/etc/nftables.conf' }}"
