---
- name: Detect container environment (/.dockerenv)
  stat:
    path: /.dockerenv
  register: _agent_dockerenv

# A single group, not "default,docker": agents enrolling at the same moment
# into a not-yet-existing multigroup race inside wazuh-db, and the loser is left
# registered but broken (no NNN.db, status "Unknown", never reported by the API).
- name: Resolve enrollment groups
  set_fact:
    _wazuh_enroll_groups: >-
      {{ wazuh_agent_container_group if _agent_dockerenv.stat.exists
         else wazuh_agent_groups }}

# Rocky ships curl-minimal, which conflicts with the curl package: only
# install when no curl binary exists.
- name: Check for curl
  ansible.builtin.stat:
    path: /usr/bin/curl
  register: _agent_curl

- name: Refresh apt cache before prerequisites
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_facts['os_family'] == 'Debian'

- name: Install prerequisites (curl)
  ansible.builtin.package:
    name: curl
    state: present
  when: not _agent_curl.stat.exists

# Pinned like the server roles: an agent newer than the manager is unsupported,
# so allow downgrading to wazuh_version.
- name: Install wazuh-agent package (apt)
  ansible.builtin.apt:
    name: "wazuh-agent{{ wazuh_pkg_suffix }}"
    allow_downgrade: true
    allow_change_held_packages: true
    state: present
    update_cache: true
  when: ansible_facts['os_family'] == 'Debian'

- name: Hold wazuh-agent (apt)
  ansible.builtin.dpkg_selections:
    name: wazuh-agent
    selection: hold
  when: ansible_facts['os_family'] == 'Debian'

- name: Install wazuh-agent package (dnf)
  ansible.builtin.dnf:
    name: "wazuh-agent{{ wazuh_pkg_suffix }}"
    allow_downgrade: true
    disable_excludes: wazuh
    state: present
  when: ansible_facts['os_family'] == 'RedHat'

- name: Deploy ossec.conf from template
  template:
    src: ossec.conf.j2
    dest: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: "0640"
  notify: Restart wazuh-agent

- name: Write authd.pass when enrollment password set
  copy:
    content: "{{ wazuh_enrollment_password }}"
    dest: /var/ossec/etc/authd.pass
    owner: root
    group: wazuh
    mode: "0640"
  when: wazuh_enrollment_password | length > 0
  notify: Restart wazuh-agent

- name: Remove authd.pass when enrollment password unset
  file:
    path: /var/ossec/etc/authd.pass
    state: absent
  when: wazuh_enrollment_password | length == 0
  notify: Restart wazuh-agent

- name: Enable and start wazuh-agent service
  systemd:
    name: wazuh-agent
    enabled: true
    state: started
    daemon_reload: true
