---
- name: Install prerequisites (gnupg, curl)
  apt:
    name:
      - gnupg
      - curl
    state: present
    update_cache: true

- name: Add Wazuh GPG key
  apt_key:
    url: "{{ wazuh_apt_key_url }}"
    state: present

- name: Add Wazuh apt repository
  apt_repository:
    repo: "{{ wazuh_apt_repo }}"
    state: present
    filename: wazuh

- name: Install wazuh-agent package
  apt:
    name: wazuh-agent
    state: present
    update_cache: true

- name: Deploy ossec.conf from template
  template:
    src: ossec.conf.j2
    dest: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: "0640"
  notify: Restart wazuh-agent

- name: Enable and start wazuh-agent service
  systemd:
    name: wazuh-agent
    enabled: true
    state: started
    daemon_reload: true
