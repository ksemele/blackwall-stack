---
- name: Debian — install indexer
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: Install prerequisites (curl, debconf, adduser)
      apt:
        name:
          - curl
          - debconf
          - adduser
        state: present
        update_cache: true

    - name: Install wazuh-indexer package
      apt:
        name: "wazuh-indexer{{ wazuh_pkg_suffix }}"
        allow_change_held_packages: true
        state: present
        update_cache: true

    - name: Hold wazuh-indexer
      ansible.builtin.dpkg_selections:
        name: wazuh-indexer
        selection: hold

- name: RedHat — install indexer
  when: ansible_facts['os_family'] == 'RedHat'
  block:
    # curl/coreutils are present as curl-minimal/coreutils-single; asking for
    # the full packages conflicts on the container image. tar is needed by
    # unarchive.
    - name: Install prerequisites (tar)
      ansible.builtin.dnf:
        name: tar
        state: present

    - name: Install wazuh-indexer package
      ansible.builtin.dnf:
        name: "wazuh-indexer{{ wazuh_pkg_suffix }}"
        disable_excludes: wazuh
        state: present

- name: Unpack cert bundle on master
  unarchive:
    src: "{{ wazuh_certs_local_dir }}/wazuh-certificates.tar"
    dest: /tmp/
    remote_src: false
  changed_when: false

- name: Ensure /etc/wazuh-indexer/certs directory exists
  file:
    path: /etc/wazuh-indexer/certs
    state: directory
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: "0500"

- name: Copy indexer node certificate
  copy:
    src: "/tmp/wazuh-certificates/{{ item.src }}"
    dest: "/etc/wazuh-indexer/certs/{{ item.dest }}"
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: "0400"
    remote_src: true
  loop:
    - { src: "root-ca.pem",                              dest: "root-ca.pem" }
    - { src: "{{ wazuh_indexer_node_name }}.pem",        dest: "{{ wazuh_indexer_node_name }}.pem" }
    - { src: "{{ wazuh_indexer_node_name }}-key.pem",    dest: "{{ wazuh_indexer_node_name }}-key.pem" }
    - { src: "admin.pem",                                dest: "admin.pem" }
    - { src: "admin-key.pem",                            dest: "admin-key.pem" }
  notify: Restart wazuh-indexer

- name: Deploy opensearch.yml
  template:
    src: opensearch.yml.j2
    dest: /etc/wazuh-indexer/opensearch.yml
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: "0640"
  notify: Restart wazuh-indexer

- name: Set JVM heap
  ansible.builtin.lineinfile:
    path: /etc/wazuh-indexer/jvm.options
    regexp: '^{{ item }}'
    line: "{{ item }}{{ wazuh_indexer_heap }}"
  loop:
    - "-Xms"
    - "-Xmx"
  when: wazuh_indexer_heap is not none
  notify: Restart wazuh-indexer

- name: Enable and start wazuh-indexer service
  systemd:
    name: wazuh-indexer
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for indexer HTTPS port (9200) to accept connections
  wait_for:
    host: "{{ wazuh_indexer_network_host }}"
    port: 9200
    timeout: 120

- name: Deploy internal_users.yml
  template:
    src: internal_users.yml.j2
    dest: /etc/wazuh-indexer/opensearch-security/internal_users.yml
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: "0640"
  register: _internal_users

- name: Push security config via securityadmin.sh
  command: >
    bash /usr/share/wazuh-indexer/plugins/opensearch-security/tools/securityadmin.sh
    -cd /etc/wazuh-indexer/opensearch-security/
    -nhnv
    -cacert /etc/wazuh-indexer/certs/root-ca.pem
    -cert /etc/wazuh-indexer/certs/admin.pem
    -key /etc/wazuh-indexer/certs/admin-key.pem
    -h {{ wazuh_indexer_network_host }}
    -p 9200
    -icl
  environment:
    JAVA_HOME: /usr/share/wazuh-indexer/jdk
  when: _internal_users.changed
  changed_when: true
