---
- name: Refuse the removed pre-RHEL variable names
  ansible.builtin.assert:
    that:
      - wazuh_apt_repo is not defined
      - wazuh_apt_key_url is not defined
    fail_msg: >-
      wazuh_apt_repo and wazuh_apt_key_url were renamed: use wazuh_apt_repo_url,
      wazuh_gpg_key_url (and wazuh_yum_repo_url for the RedHat family). The new
      repo variables hold a URL only, not a full "deb ..." line.
    quiet: true

- name: Package version suffix for pins (apt name=ver-*, dnf name-ver)
  ansible.builtin.set_fact:
    wazuh_pkg_suffix: "{{ ('=' ~ wazuh_version ~ '-*') if ansible_facts['os_family'] == 'Debian' else ('-' ~ wazuh_version) }}"

- name: Debian — Wazuh repository
  when: ansible_facts['os_family'] == 'Debian'
  block:
    - name: Wait for dpkg lock to be released
      ansible.builtin.shell: while fuser /var/lib/dpkg/lock-frontend /var/lib/dpkg/lock >/dev/null 2>&1; do sleep 2; done
      changed_when: false

    - name: Keyrings directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Wazuh signing key
      ansible.builtin.get_url:
        url: "{{ wazuh_gpg_key_url }}"
        dest: /etc/apt/keyrings/wazuh.asc
        mode: "0644"

    # Legacy entry written before signed-by existed; apt_repository would append
    # next to it instead of replacing it.
    - name: Drop legacy unsigned Wazuh apt entry
      ansible.builtin.lineinfile:
        path: /etc/apt/sources.list.d/wazuh.list
        regexp: '^deb\s+[^\[\s]'
        state: absent

    - name: Wazuh apt repository
      ansible.builtin.apt_repository:
        repo: "deb [signed-by=/etc/apt/keyrings/wazuh.asc] {{ wazuh_apt_repo_url }} stable main"
        filename: wazuh
        state: present
        update_cache: true

- name: RedHat — Wazuh repository
  when: ansible_facts['os_family'] == 'RedHat'
  ansible.builtin.yum_repository:
    name: wazuh
    description: Wazuh repository
    baseurl: "{{ wazuh_yum_repo_url }}"
    gpgkey: "{{ wazuh_gpg_key_url }}"
    gpgcheck: true
    enabled: true
