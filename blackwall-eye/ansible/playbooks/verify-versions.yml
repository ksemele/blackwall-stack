---
- name: Verify installed package versions
  hosts: all
  become: true
  gather_facts: false

  vars:
    # Mirrors wazuh_pinned_packages in the wazuh-repo role defaults.
    pinned_packages: [wazuh-agent, wazuh-manager, wazuh-indexer, wazuh-dashboard, filebeat]
    expected_packages:
      # auditd is deliberately absent here: the auditd role runs from
      # monitored-host.yml, which targets wazuh_agents only. The manager is not
      # a monitored host in this topology.
      wazuh_managers:
        - wazuh-manager
        - wazuh-indexer
        - wazuh-dashboard
        - filebeat
        - nftables
      rhel9:
        - wazuh-agent
        - audit
        - nftables
      wazuh_agents:
        - wazuh-agent
        - auditd
        - nftables

  tasks:
    - name: Resolve expected package list for this host
      ansible.builtin.set_fact:
        host_packages: >-
          {{ expected_packages['wazuh_managers']
             if 'wazuh_managers' in group_names
             else expected_packages['rhel9']
             if 'rhel9' in group_names
             else expected_packages['wazuh_agents'] }}

    - name: Query installed versions
      ansible.builtin.shell: >-
        {% if 'rhel9' in group_names %}
        rpm -q --qf '%{NAME} %{VERSION}-%{RELEASE} install ok installed\n' {{ item }} 2>/dev/null || true
        {% else %}
        dpkg-query -W -f='${Package} ${Version} ${Status}\n' {{ item }} 2>/dev/null || true
        {% endif %}
      register: pkg_query
      changed_when: false
      loop: "{{ host_packages }}"

    - name: Report versions
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }}:
          {{ item.stdout | trim if item.stdout | trim else item.item ~ ' MISSING' }}
      loop: "{{ pkg_query.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Assert every expected package is installed
      ansible.builtin.assert:
        that: item.stdout | trim is match('^\\S+ \\S+ (install|hold) ok installed$')
        fail_msg: "package {{ item.item }} is not installed on {{ inventory_hostname }}"
      loop: "{{ pkg_query.results }}"
      loop_control:
        label: "{{ item.item }}"

    # Wazuh does not support an agent newer than its manager; the roles pin both
    # to wazuh_version, this catches a role that forgets to.
    - name: Assert wazuh-agent version matches wazuh-manager
      vars:
        _ver: "{{ item.stdout.split(' ')[1] | default('') }}"
        _mgr: "{{ groups['wazuh_managers'] | first }}"
        _mgr_ver: >-
          {{ (hostvars[_mgr].pkg_query.results
              | selectattr('item', 'equalto', 'wazuh-manager') | first).stdout.split(' ')[1] }}
      ansible.builtin.assert:
        that: _ver == _mgr_ver
        fail_msg: "wazuh-agent {{ _ver }} on {{ inventory_hostname }} != wazuh-manager {{ _mgr_ver }}"
        quiet: true
      loop: "{{ pkg_query.results | selectattr('item', 'equalto', 'wazuh-agent') | list }}"
      loop_control:
        label: "{{ item.item }}"
      when: hostvars[groups['wazuh_managers'] | first].pkg_query is defined

    # Pins: Wazuh packages change version only through Ansible.
    - name: Assert pinned Wazuh packages are held (Debian)
      ansible.builtin.assert:
        that: item.stdout | trim is match('^\\S+ \\S+ hold ok installed$')
        fail_msg: "{{ item.item }} is not held on {{ inventory_hostname }} (apt-mark hold missing)"
        quiet: true
      loop: "{{ pkg_query.results | selectattr('item', 'in', pinned_packages) | list }}"
      loop_control:
        label: "{{ item.item }}"
      when: "'rhel9' not in group_names"

    - name: Read the Wazuh yum repo file (RedHat)
      ansible.builtin.slurp:
        src: /etc/yum.repos.d/wazuh.repo
      register: wazuh_repo_file
      when: "'rhel9' in group_names"

    - name: Assert the Wazuh yum repo excludes the pinned packages (RedHat)
      vars:
        _excl: "{{ (wazuh_repo_file.content | b64decode).splitlines() | select('match', '^exclude\\s*=') | list }}"
      ansible.builtin.assert:
        that:
          - _excl | length > 0
          - item in (_excl | first)
        fail_msg: "{{ item }} is not in the exclude line of /etc/yum.repos.d/wazuh.repo on {{ inventory_hostname }}"
        quiet: true
      loop: "{{ pkg_query.results | selectattr('item', 'in', pinned_packages) | map(attribute='item') | list }}"
      when: "'rhel9' in group_names"
