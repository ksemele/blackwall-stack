---
# sentinel.yml — Wazuh server stack on the RHEL-family lab node (black-sentinel-03).
# Not part of all.yml / bw-lab provision eye; run directly:
#   cd blackwall-eye && ansible-playbook ansible/playbooks/sentinel.yml
# Currently: per-host certificates + indexer + manager/filebeat (more roles are added later).

- import_playbook: wazuh-certificates.yml
  vars:
    wazuh_cert_hosts: sentinel

- name: Wazuh indexer on the sentinel node
  hosts: sentinel
  become: true
  roles:
    - wazuh-indexer

- name: Wazuh manager on the sentinel node
  hosts: sentinel
  become: true
  roles:
    - wazuh-manager
