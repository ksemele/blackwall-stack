---
# verify-sentinel.yml — checks for the Wazuh server stack on the sentinel node.
# Run via: tests/bin/bw-check sentinel
- name: Verify the sentinel node
  hosts: sentinel
  become: true
  gather_facts: false

  vars:
    sentinel_ip: "172.28.0.16"
    sentinel_units:
      - wazuh-indexer
      - wazuh-manager
      - filebeat
      - wazuh-dashboard
      - nftables
      - blackwall-cf-refresh.timer
    sentinel_pinned: [wazuh-indexer, wazuh-manager, wazuh-dashboard, filebeat]

  tasks:
    - name: Service is active
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop: "{{ sentinel_units }}"
      changed_when: false

    - name: Indexer answers on loopback (401 without credentials)
      ansible.builtin.uri:
        url: https://127.0.0.1:9200/
        validate_certs: false
        status_code: [200, 401]

    - name: API answers on loopback
      ansible.builtin.uri:
        url: https://127.0.0.1:55000/
        validate_certs: false
        status_code: [200, 401]

    - name: Dashboard answers on loopback
      ansible.builtin.uri:
        url: https://127.0.0.1:5601/
        validate_certs: false
        follow_redirects: none
        status_code: [200, 302]

    # Wazuh services must not be reachable on the lab address. Probed from
    # black-master-00; a closed port refuses, a filtered one times out.
    - name: Wazuh ports are NOT reachable on the lab IP (from black-master-00)
      ansible.builtin.shell: "timeout 4 bash -c '</dev/tcp/{{ sentinel_ip }}/{{ item }}'"
      delegate_to: black-master-00
      register: exposed
      failed_when: exposed.rc == 0
      changed_when: false
      loop: [9200, 9300, 55000, 5601]

    # The firewall probe above would hide a 0.0.0.0 bind behind input policy
    # drop, so assert the bind address itself.
    - name: Read listening sockets
      ansible.builtin.command: ss -ltnH
      register: listeners
      changed_when: false

    - name: Wazuh services listen on loopback only
      ansible.builtin.assert:
        that: >-
          listeners.stdout_lines
          | select('search', ':' ~ item ~ ' ')
          | map('split') | map(attribute=3)
          | reject('match', '^(127\\.0\\.0\\.1|\\[::ffff:127\\.0\\.0\\.1\\]|\\[::1\\]):' ~ item ~ '$')
          | list | length == 0
          and (listeners.stdout_lines | select('search', ':' ~ item ~ ' ') | list | length) > 0
        fail_msg: >-
          port {{ item }} is not bound to loopback only:
          {{ listeners.stdout_lines | select('search', ':' ~ item ~ ' ') | list }}
      loop: [9200, 9300, 55000, 5601]

    - name: Agent 000 (the manager itself) is active
      ansible.builtin.command: /var/ossec/bin/agent_control -l
      register: agents
      changed_when: false
      failed_when: >-
        agents.stdout_lines | select('search', 'ID: 000,') | select('search', 'Active/Local') | list | length != 1

    - name: Wazuh packages are excluded from dnf updates
      ansible.builtin.command: grep -E '^exclude *=.*{{ item }}' /etc/yum.repos.d/wazuh.repo
      loop: "{{ sentinel_pinned }}"
      changed_when: false

    - name: nginx (podman) answers on 443
      ansible.builtin.uri:
        url: http://127.0.0.1:443/
        status_code: 200

    # Prod 443 path: cf-wall allow (admin source) -> netavark DNAT -> forward
    # `ct status dnat accept`. 443 is not in public_tcp and forward policy is drop.
    - name: 443 answers 200 from an allowed source (black-master-00)
      ansible.builtin.shell: curl -s -m 8 -o /dev/null -w '%{http_code}' http://{{ sentinel_ip }}:443/
      delegate_to: black-master-00
      register: allowed_443
      changed_when: false
      failed_when: allowed_443.stdout != '200'

    - name: 443 is dropped for a non-allowed source (black-rocky-02)
      ansible.builtin.shell: "timeout 4 bash -c '</dev/tcp/{{ sentinel_ip }}/443'"
      delegate_to: black-rocky-02
      register: denied_443
      failed_when: denied_443.rc == 0
      changed_when: false

    - name: Read the DNAT forward rule counter
      ansible.builtin.command: nft -j list chain inet blackwall_base forward
      register: fwd_json
      changed_when: false

    - name: Forward `ct status dnat` rule counted the allowed request
      ansible.builtin.assert:
        that: >-
          (fwd_json.stdout | from_json).nftables | selectattr('rule', 'defined') | map(attribute='rule')
          | selectattr('expr', 'search', 'dnat') | map(attribute='expr') | flatten
          | selectattr('counter', 'defined') | map(attribute='counter.packets') | first | default(0) > 0
        fail_msg: "ct status dnat counter is 0 - 443 did not take the cf-wall -> DNAT -> forward path"

    - name: Container egress and DNS work under forward policy drop
      ansible.builtin.command: podman exec web wget -q -T8 --spider http://example.com
      changed_when: false

    - name: Netavark table exists before reload
      ansible.builtin.command: nft list table inet netavark
      changed_when: false

    - name: Reload nftables
      ansible.builtin.systemd:
        name: nftables
        state: reloaded

    - name: Netavark table survived the reload
      ansible.builtin.command: nft list table inet netavark
      changed_when: false

    - name: Base and wall tables survived the reload
      ansible.builtin.command: "nft list table inet {{ item }}"
      loop: [blackwall_base, blackwall_wall]
      changed_when: false

    - name: Docker embedded-DNS NAT survived the reload
      ansible.builtin.command: getent hosts black-master-00
      changed_when: false

    - name: nginx still answers on 443 after the reload
      ansible.builtin.uri:
        url: http://127.0.0.1:443/
        status_code: 200

    - name: Report
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: stack active, ports closed from the lab net, podman tables survive reload"
