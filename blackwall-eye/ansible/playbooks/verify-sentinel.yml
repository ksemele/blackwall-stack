---
# verify-sentinel.yml — checks for the Wazuh server stack on the sentinel node.
# Run via: tests/bin/bw-check sentinel
- name: Verify the sentinel node
  hosts: sentinel
  become: true
  gather_facts: false

  vars:
    sentinel_ip: "172.28.0.16"
    sentinel_units:
      - wazuh-indexer
      - wazuh-manager
      - filebeat
      - wazuh-dashboard
      - nftables
      - blackwall-cf-refresh.timer
    sentinel_pinned: [wazuh-indexer, wazuh-manager, wazuh-dashboard, filebeat]

  tasks:
    - name: Service is active
      ansible.builtin.command: "systemctl is-active {{ item }}"
      loop: "{{ sentinel_units }}"
      changed_when: false

    - name: Indexer answers on loopback (401 without credentials)
      ansible.builtin.uri:
        url: https://127.0.0.1:9200/
        validate_certs: false
        status_code: [200, 401]

    - name: API answers on loopback
      ansible.builtin.uri:
        url: https://127.0.0.1:55000/
        validate_certs: false
        status_code: [200, 401]

    - name: Dashboard answers on loopback
      ansible.builtin.uri:
        url: https://127.0.0.1:5601/
        validate_certs: false
        follow_redirects: none
        status_code: [200, 302]

    # Wazuh services must not be reachable on the lab address. Probed from
    # black-master-00; a closed port refuses, a filtered one times out.
    - name: Wazuh ports are NOT reachable on the lab IP (from black-master-00)
      ansible.builtin.shell: "timeout 4 bash -c '</dev/tcp/{{ sentinel_ip }}/{{ item }}'"
      delegate_to: black-master-00
      register: exposed
      failed_when: exposed.rc == 0
      changed_when: false
      loop: [9200, 55000, 5601]

    - name: Agent 000 (the manager itself) is active
      ansible.builtin.command: /var/ossec/bin/agent_control -l
      register: agents
      changed_when: false
      failed_when: "'ID: 000' not in agents.stdout or 'Active/Local' not in agents.stdout"

    - name: Wazuh packages are excluded from dnf updates
      ansible.builtin.command: grep -E '^exclude *=.*{{ item }}' /etc/yum.repos.d/wazuh.repo
      loop: "{{ sentinel_pinned }}"
      changed_when: false

    - name: nginx (podman) answers on 443
      ansible.builtin.uri:
        url: http://127.0.0.1:443/
        status_code: 200

    - name: Netavark table exists before reload
      ansible.builtin.command: nft list table inet netavark
      changed_when: false

    - name: Reload nftables
      ansible.builtin.systemd:
        name: nftables
        state: reloaded

    - name: Netavark table survived the reload
      ansible.builtin.command: nft list table inet netavark
      changed_when: false

    - name: Docker embedded-DNS NAT survived the reload
      ansible.builtin.command: getent hosts black-master-00
      changed_when: false

    - name: nginx still answers on 443 after the reload
      ansible.builtin.uri:
        url: http://127.0.0.1:443/
        status_code: 200

    - name: Report
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: stack active, ports closed from the lab net, podman tables survive reload"
