---
# Empty secrets render a script that can never work (e.g. a lab run without
# `direnv exec .`). Fail before touching the host; disabling needs no secrets.
- name: Require Claude and Telegram credentials when enabled
  ansible.builtin.assert:
    that:
      - claude_api_key | default('') | length > 0
      - telegram_bot_token | default('') | length > 0
      - telegram_chat_id | default('') | string | length > 0
    fail_msg: >-
      claude_api_key / telegram_bot_token / telegram_chat_id is empty. In the lab
      run through `direnv exec .` (values come from .envrc), elsewhere pass them
      via ansible-vault. To turn the analyst off use -e brain_enabled=false.
    quiet: true
  when: brain_enabled | bool

- name: Ensure python3 is installed
  ansible.builtin.package:
    name: python3
    state: present

- name: Create brain-analyst install directory
  ansible.builtin.file:
    path: "{{ brain_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create brain-analyst state directory
  ansible.builtin.file:
    path: "{{ brain_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create brain-analyst log directory
  ansible.builtin.file:
    path: "{{ brain_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy brain analyst script
  ansible.builtin.template:
    src: brain.py.j2
    dest: "{{ brain_install_dir }}/brain.py"
    owner: root
    group: root
    mode: "0750"
  notify: Restart brain-analyst service

- name: Deploy systemd unit
  ansible.builtin.template:
    src: brain.service.j2
    dest: /etc/systemd/system/brain-analyst.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd daemon
    - Restart brain-analyst service

- name: Enable and start brain-analyst (brain_enabled) or stop and disable it
  ansible.builtin.systemd:
    name: brain-analyst
    enabled: "{{ brain_enabled | bool }}"
    state: "{{ 'started' if brain_enabled | bool else 'stopped' }}"
    daemon_reload: true
