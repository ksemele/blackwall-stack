---
# Verify brain-analyst is running and analyses an injected synthetic alert.
# The alert goes into alerts.json, filebeat ships it to the indexer, Brain
# polls the indexer, asks the model and sends to Telegram.
- name: blackwall-brain | verify brain-analyst
  hosts: wazuh_managers
  become: true
  vars:
    synthetic_alert_id: "verify-brain-{{ ansible_date_time.epoch }}"
    synthetic_alert_json: >-
      {"id":"{{ synthetic_alert_id }}","timestamp":"{{ ansible_date_time.iso8601_micro[:23] }}+0000",
      "rule":{"level":10,"description":"Synthetic verify-brain test alert","id":"99998"},
      "agent":{"id":"000","name":"verify-bot"},"manager":{"name":"black-master-00"},
      "full_log":"synthetic alert injected by verify-brain.yml"}
    brain_has_credentials: >-
      {{ (brain_model_api_key | default(claude_api_key | default(''))) | length > 0
         and (telegram_bot_token | default('')) | length > 0 }}

  tasks:
    - name: Check brain-analyst service is active
      ansible.builtin.systemd:
        name: brain-analyst
      register: svc_state

    - name: Assert service is running
      ansible.builtin.assert:
        that:
          - svc_state.status.ActiveState in ["active", "activating"]
        fail_msg: "brain-analyst service is not active (state: {{ svc_state.status.ActiveState }})"
        success_msg: "brain-analyst is {{ svc_state.status.ActiveState }}"

    - name: Inject synthetic high-severity alert into alerts.json
      ansible.builtin.shell:
        cmd: "printf '%s\\n' '{{ synthetic_alert_json }}' >> /var/ossec/logs/alerts/alerts.json"

    # filebeat (a few s) + poll (5 s) + model (a few s) + Telegram.
    # With credentials the alert must be delivered; without, only picked up.
    - name: Wait for brain-analyst to handle the synthetic alert
      ansible.builtin.shell:
        cmd: >-
          journalctl -u brain-analyst --no-pager --since '-10min'
          | grep -E '{{ "delivered" if brain_has_credentials | bool else "(analysed|analysis failed)" }}.*alert={{ synthetic_alert_id }}'
      register: brain_handled
      until: brain_handled.rc == 0
      retries: 24
      delay: 5
      changed_when: false
      failed_when: false

    - name: Show the last brain-analyst log lines
      ansible.builtin.shell:
        cmd: journalctl -u brain-analyst --no-pager -n 20
      register: log_tail
      changed_when: false

    - name: Print brain analyst log tail
      ansible.builtin.debug:
        msg: "{{ log_tail.stdout_lines }}"

    - name: Assert brain-analyst handled the synthetic alert
      ansible.builtin.assert:
        that: brain_handled.rc == 0
        fail_msg: >-
          Synthetic alert '{{ synthetic_alert_id }}' was not
          {{ 'delivered' if brain_has_credentials | bool else 'picked up' }} within 120 s.
        success_msg: >-
          brain-analyst {{ 'delivered' if brain_has_credentials | bool else 'picked up' }}
          synthetic alert '{{ synthetic_alert_id }}'
