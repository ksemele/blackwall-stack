name: sshd-banner
description: An admin adds a legal login banner to sshd_config.
agent: black-host-01
wait_s: 90
steps:
- host: black-host-01
  user: root
  run: cp -p /etc/ssh/sshd_config /root/.sshd_config.orig && printf 'Banner /etc/issue.net\n' >> /etc/ssh/sshd_config
cleanup:
- host: black-host-01
  user: root
  run: cp -p /root/.sshd_config.orig /etc/ssh/sshd_config && rm -f /root/.sshd_config.orig
expected:
- rule_id: '550'
  verdict: false_positive
  severity: low
  category: false_positive
  why: A login banner is a compliance setting with no security downside.
