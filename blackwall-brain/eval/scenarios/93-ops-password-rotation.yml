name: ops-password-rotation
description: The ops admin rotates their own password.
agent: black-host-01
wait_s: 90
setup:
- host: black-host-01
  user: root
  run: id ops >/dev/null 2>&1 || (useradd -m -s /bin/bash -c 'Ops admin' ops && usermod -aG sudo ops &&
    echo 'ops:Op5-Rotate-77' | chpasswd)
steps:
- host: black-host-01
  user: root
  run: echo 'ops:Op5-Rotate-78' | chpasswd
cleanup: []
expected:
- rule_id: '5555'
  verdict: false_positive
  severity: low
  category: false_positive
  why: An admin rotating their own password is routine.
  match:
    full_log: for ops
  needs_context: true
