name: root-password-reset
description: The root password is changed outside any maintenance.
agent: black-host-01
wait_s: 90
steps:
- host: black-host-01
  user: root
  run: echo 'root:Pwn3d-2026!' | chpasswd
cleanup:
- host: black-host-01
  user: root
  run: echo 'root:blackwall' | chpasswd
expected:
- rule_id: '5555'
  verdict: true_positive
  severity: medium
  category: persistence
  why: 'An unplanned root password change is account manipulation: it can lock admins out or keep access.'
  match:
    full_log: for root
  needs_context: true
