---
- name: Reload systemd
  ansible.builtin.systemd:
    daemon_reload: true

# rc 2 = first run without data, an empty blocklist was loaded (fail open).
# rc 3 = download failed, table rebuilt from cached data (current mode/allowlist).
- name: Refresh Fang blocklists
  ansible.builtin.command: /usr/local/sbin/blackwall-fang-refresh
  register: fang_refresh
  failed_when: fang_refresh.rc not in [0, 2, 3]
