# Managed by the Ansible role blackwall-fang/fang-reputation. Do not edit by hand.
#
# Eye's drop-in (blackwall.conf) resets ExecStop= and removes only its own
# tables; this file sorts after it and appends Fang's table so that
# `systemctl stop nftables` removes it too. Reload re-reads /etc/nftables.d/*.nft.
[Service]
ExecStop=-/usr/sbin/nft delete table inet blackwall_fang
