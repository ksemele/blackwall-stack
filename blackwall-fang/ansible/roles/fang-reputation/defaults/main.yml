---
# observe: sets fill, hits are counted and alerted, nothing is dropped.
# enforce: the same, plus drop.
fang_mode: observe

# External interface. Required: no autodetect (a wrong name would make
# `iifname != WAN accept` accept everything).
fang_wan_if: ""

# Never blocked, in addition to Cloudflare ranges (fetched) and this host's
# own addresses: owner/admin/monitoring sources, IPv4 CIDRs. Fang filters ALL
# WAN ports including SSH, so enforce mode requires it to be non-empty: put the
# admin addresses (the same as cfwall_admin_allow), monitoring and agent sources here,
# e.g. fang_allowlist: "{{ cfwall_admin_allow + ['198.51.100.0/24'] }}" in the inventory.
fang_allowlist: []

# Reputation lists. https only (file:// needs fang_test_mode).
fang_sources:
  - https://www.spamhaus.org/drop/drop_v4.json
  - https://iplists.firehol.org/files/firehol_level1.netset
fang_cloudflare_url: https://www.cloudflare.com/ips-v4

# Abort the refresh when fewer blocklist entries survive filtering.
fang_min_entries: 500

# A cache older than this is not trusted when the download fails or the fresh
# data is rejected: the blocklist is emptied (fail open, exit 4, ERROR in syslog).
fang_max_cache_age_days: 7

# Refresh timer (systemd OnCalendar) and jitter.
fang_refresh_calendar: daily
fang_refresh_jitter: 1h

# Lab only. Test mode allows file:// sources and lets fang_test_blockable
# (private addresses, e.g. lab containers) through the reserved-range filter.
# fang_test_files are copied from the controller to /etc/blackwall/fang-test/.
fang_test_mode: false
fang_test_blockable: []
fang_test_files: []

# Layer 2: per-source connection-attempt detectors (observe only, never drop).
# New TCP SYNs from one source over a rate put the source in a flagged set
# (ssh_flagged / scan_flagged / rate_flagged, 1h timeout) and the exporter reports
# it (kinds ssh_attempts / scan_attempts / rate_attempts -> Eye rules 100210-100212).
# Allowlisted and established traffic is never counted. Independent of the blocklists.
fang_attempts_enabled: true
# TCP ports treated as SSH.
fang_ssh_ports: [22]
# TCP ports that are really open on this host. The closed-port scan detector is
# rendered only when this is non-empty: list every listening and published port
# (and the agent/monitoring ports), or legitimate clients are flagged as scanners.
fang_open_tcp: []
# Rates are "N/second|minute|hour|day"; burst is in packets.
fang_ssh_rate: 6/minute
fang_ssh_burst: 4
fang_scan_rate: 10/minute
fang_scan_burst: 10
fang_conn_rate: 120/minute
fang_conn_burst: 60
# Max tracked sources per meter / flagged set.
fang_meter_size: 65536
fang_flagged_size: 65536
