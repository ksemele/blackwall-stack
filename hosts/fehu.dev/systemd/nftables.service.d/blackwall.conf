# Drop-in для nftables.service.
#
# Штатные команды RHEL-пакета:
#   ExecReload=/sbin/nft 'flush ruleset; include "/etc/sysconfig/nftables.conf";'
#   ExecStop=/sbin/nft flush ruleset
#
# `flush ruleset` сносит ВСЕ таблицы, включая `ip nat` и `ip filter` от
# netavark. На хосте с podman это означает: `systemctl reload nftables` убивает
# DNAT на 443 и сеть контейнеров до `systemctl restart podman`.
#
# Здесь служба ограничена собственными таблицами. Наши .nft-файлы используют
# идиому «создать / удалить / определить заново», поэтому повторное применение
# атомарно и не рвёт установленные соединения.

[Service]
ExecReload=
ExecReload=/usr/sbin/nft -f /etc/sysconfig/nftables.conf

ExecStop=
ExecStop=-/usr/sbin/nft delete table inet blackwall_wall
ExecStop=-/usr/sbin/nft delete table inet blackwall_base
