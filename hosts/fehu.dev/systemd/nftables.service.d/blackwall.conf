# Drop-in for nftables.service.
#
# Stock commands of the RHEL package:
#   ExecReload=/sbin/nft 'flush ruleset; include "/etc/sysconfig/nftables.conf";'
#   ExecStop=/sbin/nft flush ruleset
#
# `flush ruleset` wipes ALL tables, including netavark's `ip nat` and
# `ip filter`. On a podman host that means `systemctl reload nftables` kills the
# DNAT on 443 and container networking until `systemctl restart podman`.
#
# Here the service is limited to our own tables. Our .nft files use the
# "create / delete / redefine" idiom, so re-applying them is atomic and does
# not drop established connections.

[Service]
ExecReload=
ExecReload=/usr/sbin/nft -f /etc/sysconfig/nftables.conf

ExecStop=
ExecStop=-/usr/sbin/nft delete table inet blackwall_wall
ExecStop=-/usr/sbin/nft delete table inet blackwall_base
