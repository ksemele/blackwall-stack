# /etc/sysconfig/nftables.conf — what nftables.service loads at start.
#
# Order matters: base sets the default policy (input/forward drop),
# wall attaches the Cloudflare filter for 80/443 in prerouting.
#
# netavark's tables (`ip nat`, `ip filter`) are DELIBERATELY absent here:
# podman creates them when containers start, versioning them is pointless.
# The stock ExecReload/ExecStop of nftables.service runs `flush ruleset` and
# would wipe them along with ours — hence it is overridden by the drop-in
# /etc/systemd/system/nftables.service.d/blackwall.conf

include "/etc/nftables.d/blackwall-base.nft"
include "/etc/nftables.d/blackwall-wall.nft"
