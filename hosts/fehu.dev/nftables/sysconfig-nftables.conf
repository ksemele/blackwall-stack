# /etc/sysconfig/nftables.conf — что грузит nftables.service при старте.
#
# Порядок важен: base определяет политику по умолчанию (input/forward drop),
# wall навешивает фильтр Cloudflare на 80/443 в prerouting.
#
# Таблицы netavark (`ip nat`, `ip filter`) здесь СОЗНАТЕЛЬНО отсутствуют:
# их создаёт podman при старте контейнеров, версионировать их бессмысленно.
# Штатный ExecReload/ExecStop у nftables.service делает `flush ruleset` и снёс
# бы их вместе с нашими — поэтому он переопределён drop-in'ом
# /etc/systemd/system/nftables.service.d/blackwall.conf

include "/etc/nftables.d/blackwall-base.nft"
include "/etc/nftables.d/blackwall-wall.nft"
