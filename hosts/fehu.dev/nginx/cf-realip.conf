# Snapshot from 2026-08-15 — kept up to date by blackwall-cf-refresh from here on.
#
# Why: once the whitelist is on, all traffic arrives from Cloudflare addresses.
# Without real_ip, access.log, limit_req/limit_conn, geo/allow-deny and anything
# else that sees $remote_addr would treat CF as the client. That breaks both
# incident analysis and rate limiting (all visitors collapse into a few proxy "clients").
#
# Put it in the http context: /etc/nginx/conf.d/cf-realip.conf
# (nginx.conf on Debian/Ubuntu already has include /etc/nginx/conf.d/*.conf;)

