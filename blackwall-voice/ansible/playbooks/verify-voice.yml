---
# Verify telegram-alerter is running and processes injected synthetic alerts
- name: blackwall-voice | verify telegram-alerter
  hosts: wazuh_managers
  become: true
  vars:
    # The deployed MAX_LEVEL is the truth (read from the installed script, so
    # it does not depend on how the alerter was deployed). With it set (Brain
    # on), the alert is injected at that level and Voice must deliver it; when
    # the window is empty (max < severity_threshold) it is injected at
    # severity_threshold and Voice must skip it instead.
    verify_max: "{{ deployed_max.stdout | trim if deployed_max.stdout is defined and deployed_max.stdout | trim != 'None' else '' }}"
    verify_level: >-
      {{ verify_max | int if (verify_max and verify_max | int >= severity_threshold | default(5) | int)
         else severity_threshold | default(5) | int }}
    expect_delivery: "{{ not verify_max or verify_level | int <= verify_max | int }}"
    synthetic_alert_id: "verify-voice-{{ ansible_date_time.epoch }}"
    synthetic_alert_json: >-
      {"id":"{{ synthetic_alert_id }}","timestamp":"{{ ansible_date_time.iso8601 }}",
      "rule":{"level":{{ verify_level | int }},"description":"Synthetic verify-voice test alert","id":"99999"},
      "agent":{"name":"verify-bot"},"manager":{"name":"black-master-00"},
      "full_log":"synthetic alert injected by verify-voice.yml"}

  tasks:
    - name: Read the deployed upper bound (MAX_LEVEL)
      ansible.builtin.shell:
        cmd: "sed -n 's/^MAX_LEVEL *= *//p' {{ alerter_install_dir | default('/opt/voice-alerter') }}/alerter.py"
      register: deployed_max
      changed_when: false

    - name: Check voice-alerter service is active
      ansible.builtin.systemd:
        name: voice-alerter
      register: svc_state

    - name: Assert service is running
      ansible.builtin.assert:
        that:
          - svc_state.status.ActiveState in ["active", "activating"]
        fail_msg: "voice-alerter service is not active (state: {{ svc_state.status.ActiveState }})"
        success_msg: "voice-alerter is {{ svc_state.status.ActiveState }}"

    - name: Show last 30 lines of alerter log
      ansible.builtin.command: tail -n 30 /var/log/voice-alerter/alerter.log
      register: log_tail
      changed_when: false

    - name: Print alerter log tail
      ansible.builtin.debug:
        msg: "{{ log_tail.stdout_lines }}"

    - name: Ensure alerts.json exists (touch without replacing)
      ansible.builtin.file:
        path: /var/ossec/logs/alerts/alerts.json
        state: touch
        owner: wazuh
        group: wazuh
        mode: "0640"
        modification_time: preserve
        access_time: preserve

    - name: Inject synthetic high-severity alert into alerts.json
      ansible.builtin.shell:
        cmd: "printf '%s\\n' '{{ synthetic_alert_json }}' >> /var/ossec/logs/alerts/alerts.json"

    - name: Wait for alerter to process the synthetic alert
      ansible.builtin.pause:
        seconds: "{{ poll_interval | default(5) | int + 3 }}"

    - name: Read state file
      ansible.builtin.slurp:
        src: "{{ alerter_state_file | default('/var/lib/voice-alerter/sent_ids.txt') }}"
      register: state_file_content
      ignore_errors: true

    - name: Check synthetic alert ID is in state file (dedup confirmation)
      when: expect_delivery | bool
      ansible.builtin.assert:
        that:
          - state_file_content.content is defined
          - synthetic_alert_id in (state_file_content.content | b64decode)
        fail_msg: >-
          Synthetic alert ID '{{ synthetic_alert_id }}' not found in state file.
          State file content: {{ state_file_content.content | default('') | b64decode }}
          The ID is written only after Telegram accepted the message: check the
          bot token / chat id and the alerter log.
        success_msg: "Dedup state file contains synthetic alert ID — alerter processed and sent successfully"
      # Without a token there is nothing to deliver; only the pickup is checked below.
      ignore_errors: "{{ (telegram_bot_token | default('')) | length == 0 }}"

    # A fresh lab has no state file until Voice sends something: with Brain on
    # it may never send, so a missing file means "not sent" too.
    - name: Check Voice did not send the alert above voice_max_level (Brain covers it)
      when: not (expect_delivery | bool)
      ansible.builtin.assert:
        that:
          - synthetic_alert_id not in (state_file_content.content | default('') | b64decode)
        fail_msg: "Voice sent alert '{{ synthetic_alert_id }}' although Brain covers levels above {{ verify_max }}"
        success_msg: "Alert above voice_max_level ({{ verify_max }}) was not sent by Voice"

    - name: Check Voice logged the skip
      when: not (expect_delivery | bool)
      ansible.builtin.command:
        cmd: "grep -q 'Skipped alert {{ synthetic_alert_id }} ' /var/log/voice-alerter/alerter.log"
      changed_when: false

    - name: Show state file contents
      ansible.builtin.debug:
        msg: "State file: {{ state_file_content.content | default('') | b64decode }}"

    - name: Confirm alerter processed the synthetic alert (check log)
      ansible.builtin.command:
        cmd: "grep -q '{{ synthetic_alert_id }}' /var/log/voice-alerter/alerter.log"
      register: log_check
      changed_when: false
      failed_when: false

    - name: Assert alerter picked up the synthetic alert
      ansible.builtin.assert:
        that: log_check.rc == 0
        fail_msg: >-
          Synthetic alert '{{ synthetic_alert_id }}' not found in alerter log.
          The alerter may not have picked up the injected alert.
        success_msg: "Alerter picked up and attempted synthetic alert '{{ synthetic_alert_id }}'"
