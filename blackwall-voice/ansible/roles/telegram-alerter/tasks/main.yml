---
# Empty secrets render an alerter that can never deliver (e.g. a lab run
# without `direnv exec .`). Fail before touching the host.
- name: Require Telegram credentials
  ansible.builtin.assert:
    that:
      - telegram_bot_token | default('') | length > 0
      - telegram_chat_id | default('') | string | length > 0
    fail_msg: >-
      telegram_bot_token / telegram_chat_id is empty. In the lab run through
      `direnv exec .` (values come from .envrc), elsewhere use ansible-vault.
    quiet: true

# Fail-safe: an upper bound only makes sense while Brain covers the alerts above
# it. If the cover unit is not enabled and active on this host, ignore the bound
# (the alerter also re-checks at runtime). Otherwise cap the bound at the
# deployed Brain's analysis threshold - 1.
- name: Probe the covering unit (only when voice_max_level is set)
  ansible.builtin.shell:
    cmd: "systemctl is-enabled {{ voice_cover_unit }} && systemctl is-active {{ voice_cover_unit }}"
  register: voice_brain_probe
  changed_when: false
  failed_when: false
  when: voice_max_level | default('') | string | trim | length > 0

- name: Read the deployed analysis threshold
  ansible.builtin.shell:
    cmd: "sed -n 's/^ANALYSIS_THRESHOLD *= *\\([0-9][0-9]*\\).*/\\1/p' {{ voice_cover_script }}"
  register: voice_brain_thr
  changed_when: false
  failed_when: false
  when: voice_max_level | default('') | string | trim | length > 0

- name: Resolve the effective upper bound
  ansible.builtin.set_fact:
    voice_cfg_level: "{{ voice_max_level | default('') | string | trim }}"
    voice_cover_thr: "{{ voice_brain_thr.stdout | default('') | trim }}"
    voice_cover_ok: "{{ (voice_brain_probe.rc | default(1)) == 0 }}"

- name: Resolve the effective upper bound (value)
  ansible.builtin.set_fact:
    voice_max_level_effective: >-
      {{ '' if (voice_cfg_level == '' or not voice_cover_ok | bool)
         else ([voice_cfg_level | int, voice_cover_thr | int - 1] | min if voice_cover_thr != ''
               else voice_cfg_level | int) }}

- name: Warn that voice_max_level is ignored
  ansible.builtin.debug:
    msg: "voice_max_level ignored: {{ voice_cover_unit }} is not running on this host (Voice forwards everything >= severity_threshold)"
  when:
    - voice_max_level | default('') | string | trim | length > 0
    - voice_max_level_effective | string | length == 0

- name: Warn that voice_max_level was clamped
  ansible.builtin.debug:
    msg: "voice_max_level clamped from {{ voice_max_level }} to {{ voice_max_level_effective }} (deployed analysis_threshold - 1)"
  when:
    - voice_max_level_effective | string | length > 0
    - voice_max_level_effective | int != voice_max_level | int

- name: Ensure python3 is installed
  ansible.builtin.package:
    name: python3
    state: present

- name: Create alerter install directory
  ansible.builtin.file:
    path: "{{ alerter_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create alerter state directory
  ansible.builtin.file:
    path: "{{ alerter_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Create alerter log directory
  ansible.builtin.file:
    path: "{{ alerter_log_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: Deploy alerter script
  ansible.builtin.template:
    src: alerter.py.j2
    dest: "{{ alerter_install_dir }}/alerter.py"
    owner: root
    group: root
    mode: "0750"
  notify: Restart voice-alerter

- name: Deploy systemd unit
  ansible.builtin.template:
    src: alerter.service.j2
    dest: /etc/systemd/system/voice-alerter.service
    owner: root
    group: root
    mode: "0644"
  notify:
    - Reload systemd
    - Restart voice-alerter

- name: Enable and start voice-alerter service
  ansible.builtin.systemd:
    name: voice-alerter
    enabled: true
    state: started
    daemon_reload: true
